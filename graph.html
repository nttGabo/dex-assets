<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --blue: #3b82f6;
      --gray: #e5e7eb;
      --text: #101828;
      --muted: #667085;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .graph {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .donut {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      position: relative;
    }

    .donut::after {
      content: "";
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: white;
      position: absolute;
    }

    .center {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .center strong {
      display: block;
      font-size: 2rem;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--text);
    }

    .center span {
      display: block;
      margin-top: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
    }

    .updated {
      margin-top: 14px;
      font-size: 0.72rem;
      color: var(--muted);
    }
  </style>
</head>

<body>

  <div class="graph">

    <div class="donut" id="donut">
      <div class="center">
        <strong>DEX</strong>
        <span id="percentText"></span>
      </div>
    </div>

    <div class="updated" id="updatedText"></div>

  </div>

  <script>
    
    const advisoryPercent = 68;
    const updatedAt = "26/09/2026";

    // ============================

    const donut = document.getElementById("donut");
    const percentText = document.getElementById("percentText");
    const updatedText = document.getElementById("updatedText");

    donut.style.background = `
      conic-gradient(
        var(--blue) 0 ${advisoryPercent}%,
        var(--gray) ${advisoryPercent}% 100%
      )
    `;

    percentText.textContent = `${advisoryPercent}% Advisory`;

    updatedText.textContent = `Actualizado el ${updatedAt}`;
  </script>

</body>
</html>
