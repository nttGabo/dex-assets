<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --primary: #f24d7a;
      --blue: #3b82f6;
      --blue-light: #60a5fa;
      --blue-soft: #bfdbfe;
      --blue-pale: #dbeafe;
      --text: #101828;
      --muted: #667085;
      --border: #e4e7ec;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .graph {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
    }

    .donut {
      width: 190px;
      height: 190px;
      border-radius: 50%;

      background:
        conic-gradient(
          var(--blue) 0 25%,
          var(--blue-light) 25% 50%,
          var(--blue-soft) 50% 75%,
          var(--blue-pale) 75% 100%
        );

      display: grid;
      place-items: center;
      position: relative;
    }

    .donut::after {
      content: "";
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: white;
      position: absolute;
    }

    .center {
      position: relative;
      z-index: 2;
      text-align: center;
      line-height: 1.1;
    }

    .center strong {
      display: block;
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--text);
    }

    .center span {
      display: block;
      margin-top: 5px;
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 600;
    }

    .legend {
      display: grid;
      grid-template-columns: repeat(2, auto);
      column-gap: 18px;
      row-gap: 5px;

      font-size: 0.68rem;
      line-height: 1.2;
      color: var(--muted);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    .dot-1 { background: var(--blue); }
    .dot-2 { background: var(--blue-light); }
    .dot-3 { background: var(--blue-soft); }
    .dot-4 { background: var(--blue-pale); }
  </style>
</head>

<body>

  <div class="graph">

    <div class="donut">
      <div class="center">
        <strong>DEX</strong>
        <span>Advisory</span>
      </div>
    </div>

    <div class="legend">
      <div class="legend-item">
        <span class="dot dot-1"></span>
        Insights / Research
      </div>

      <div class="legend-item">
        <span class="dot dot-2"></span>
        Design / Service
      </div>

      <div class="legend-item">
        <span class="dot dot-3"></span>
        Producto / Negocio
      </div>

      <div class="legend-item">
        <span class="dot dot-4"></span>
        Transformación / Org
      </div>
    </div>

  </div>

</body>
</html>
